canisters:
  - name: edge
    build:
      steps:
        - type: script
          commands:
            - scripts/build_facilitator_canister.sh "$ICP_WASM_OUTPUT_PATH"
            - candid-extractor "$ICP_WASM_OUTPUT_PATH" > dist/facilitator.did
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" metadata "candid:service" -f dist/facilitator.did -v public --keep-name-section
environments:
  - name: local
    network: local
    canisters:
      - edge
  - name: ic
    network: ic
    canisters:
      - edge
