[package]
name = "jpyc_x402_facilitator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10.28"
evm_rpc_client = "0.4.0"
evm_rpc_types = "3.1.1"
hex = "0.4.3"
ic-canister-runtime = "0.2.3"
ic-cdk = "0.20.1"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
rlp = "0.5.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha3 = "0.10.8"
