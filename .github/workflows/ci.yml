name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: cargo test -p jpyc_x402_facilitator
      - run: cargo fmt -- --check
      - run: cargo clippy -p jpyc_x402_facilitator -- -D warnings
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: cargo install candid-extractor --locked
      - run: mkdir -p dist
      - run: candid-extractor target/wasm32-unknown-unknown/release/jpyc_x402_facilitator.wasm > dist/facilitator.did
      - run: git ls-files --error-unmatch dist/facilitator.did
      - run: git diff --exit-code -- dist/facilitator.did
